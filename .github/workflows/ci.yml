name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Smoke-test read-only commands on the runner
        env:
          FRAPPE_HOST_HOME: ${{ runner.temp }}/frappe-host
        run: |
          frappe-host --version
          frappe-host doctor --json > /dev/null || [ $? -eq 3 ]
          frappe-host bench discover
